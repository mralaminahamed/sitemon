# ==============================================================================
# Sitemon Platform — Production stack (published images + Caddy).
# Usage: docker compose -f infra/docker-compose.prod.yml up -d
# Set IMAGE_TAG (default latest) and secrets in ../.env.
# ==============================================================================

name: sitemon-prod

x-svc: &svc
  env_file: [../.env]
  restart: unless-stopped
  networks: [sitemon-net]
  depends_on:
    mongo: { condition: service_healthy }
    redis: { condition: service_healthy }
    nats: { condition: service_healthy }

services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-sitemon}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-sitemon}
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [sitemon-net]

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-sitemon} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-sitemon}
    restart: unless-stopped
    networks: [sitemon-net]

  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222", "--user", "${NATS_USER:-sitemon}", "--pass", "${NATS_PASSWORD:-sitemon}"]
    volumes: [nats-data:/data]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"], interval: 5s, timeout: 3s, retries: 10 }
    restart: unless-stopped
    networks: [sitemon-net]

  gateway:
    <<: *svc
    image: ghcr.io/mralaminahamed/sitemon/gateway:${IMAGE_TAG:-latest}
    environment:
      PORT: "8080"
      NATS_URL: nats://${NATS_USER:-sitemon}:${NATS_PASSWORD:-sitemon}@nats:4222
      REDIS_URL: redis://:${REDIS_PASSWORD:-sitemon}@redis:6379/0
      MONGO_URI: mongodb://${MONGO_USER:-sitemon}:${MONGO_PASSWORD:-sitemon}@mongo:27017/sitemon?authSource=admin
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}

  checker:
    <<: *svc
    image: ghcr.io/mralaminahamed/sitemon/checker:${IMAGE_TAG:-latest}
    environment:
      PORT: "8081"
      NATS_URL: nats://${NATS_USER:-sitemon}:${NATS_PASSWORD:-sitemon}@nats:4222

  scheduler:
    <<: *svc
    image: ghcr.io/mralaminahamed/sitemon/scheduler:${IMAGE_TAG:-latest}
    environment:
      PORT: "8082"
      NATS_URL: nats://${NATS_USER:-sitemon}:${NATS_PASSWORD:-sitemon}@nats:4222
      # Needed to dispatch monitors added via the API/web, not just SCHEDULE_URLS.
      MONGO_URI: mongodb://${MONGO_USER:-sitemon}:${MONGO_PASSWORD:-sitemon}@mongo:27017/sitemon?authSource=admin
      SCHEDULE_CRON: ${SCHEDULE_CRON:-*/5 * * * *}
      SCHEDULE_URLS: ${SCHEDULE_URLS:-https://example.com}

  notifier:
    <<: *svc
    image: ghcr.io/mralaminahamed/sitemon/notifier:${IMAGE_TAG:-latest}
    environment:
      PORT: "8083"
      NATS_URL: nats://${NATS_USER:-sitemon}:${NATS_PASSWORD:-sitemon}@nats:4222
      REDIS_URL: redis://:${REDIS_PASSWORD:-sitemon}@redis:6379/0
      MONGO_URI: mongodb://${MONGO_USER:-sitemon}:${MONGO_PASSWORD:-sitemon}@mongo:27017/sitemon?authSource=admin
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALERT_FAILURE_THRESHOLD: ${ALERT_FAILURE_THRESHOLD:-2}

  ai:
    <<: *svc
    image: ghcr.io/mralaminahamed/sitemon/ai:${IMAGE_TAG:-latest}
    environment:
      PORT: "8090"
      NATS_URL: nats://${NATS_USER:-sitemon}:${NATS_PASSWORD:-sitemon}@nats:4222
      MONGO_URI: mongodb://${MONGO_USER:-sitemon}:${MONGO_PASSWORD:-sitemon}@mongo:27017/sitemon?authSource=admin
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}

  web:
    image: ghcr.io/mralaminahamed/sitemon/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [sitemon-net]
    depends_on: [gateway]

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      # Bare port (:80) = HTTP; a domain = automatic HTTPS via Caddy.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [web, gateway]
    restart: unless-stopped
    networks: [sitemon-net]

volumes:
  mongo-data:
  redis-data:
  nats-data:
  caddy-data:

networks:
  sitemon-net:
    driver: bridge
