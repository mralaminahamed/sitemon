# ==============================================================================
# Sitemon Platform — Local Development Stack
# ------------------------------------------------------------------------------
# Author : Al Amin Ahamed
# File   : infra/docker-compose.yml
# Purpose: Single-command local development environment.
#          Up   : docker compose -f infra/docker-compose.yml up -d
#          Down : docker compose -f infra/docker-compose.yml down -v
#
# Phase 0: backing stores (mongo/redis/nats) + the gateway stub wired in so the
# stack runs end to end. Other services (checker/scheduler/notifier/ai) are
# defined and commented; uncomment as each phase lands. See PLAN.md.
# ==============================================================================

name: sitemon

# ------------------------------------------------------------------------------
# Shared base for every Go service — keeps declarations DRY.
# ------------------------------------------------------------------------------
x-go-svc: &go-svc
  build:
    context: ..
    dockerfile: Dockerfile
    target: dev
  env_file:
    - ../.env
  environment:
    # Docker-internal hostnames override any localhost URLs from .env.
    MONGO_URI: mongodb://sitemon:sitemon@mongo:27017/sitemon?authSource=admin
    REDIS_URL: redis://redis:6379/0
    NATS_URL: nats://nats:4222
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ..:/src:cached          # live reload on host edits (air)
    - go-build:/root/.cache/go-build
    - go-mod:/go/pkg/mod
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy
    nats:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - sitemon-net

services:

  # ----------------------------------------------------------------------------
  # MongoDB 7 — check history / time-series results (Phase 3 consumer).
  # ----------------------------------------------------------------------------
  mongo:
    image: mongo:7
    container_name: sitemon-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-sitemon}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-sitemon}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-sitemon}
    volumes:
      - mongo-data:/data/db
      - ./mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    ports:
      - "127.0.0.1:27099:27017"   # localhost only; offset avoids host mongo clash
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - sitemon-net

  # ----------------------------------------------------------------------------
  # Redis 7 — latest-status cache, notifier dedup state, distributed rate limit.
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sitemon-redis
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6399:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - sitemon-net

  # ----------------------------------------------------------------------------
  # NATS 2 (JetStream) — event bus: check.job / check.result / alert.raised.
  # ----------------------------------------------------------------------------
  nats:
    image: nats:2-alpine
    container_name: sitemon-nats
    command: ["-js", "-m", "8222"]
    volumes:
      - nats-data:/data
    ports:
      - "127.0.0.1:4299:4222"     # client
      - "127.0.0.1:8299:8222"     # monitoring
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - sitemon-net

  # ----------------------------------------------------------------------------
  # Gateway — REST/WS entrypoint. Phase 0: health stub on :8080.
  # ----------------------------------------------------------------------------
  gateway:
    <<: *go-svc
    container_name: sitemon-gateway
    command: ["go", "run", "./apps/gateway/cmd"]
    environment:
      PORT: "8080"
      MONGO_URI: mongodb://sitemon:sitemon@mongo:27017/sitemon?authSource=admin
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
    ports:
      - "0.0.0.0:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  checker:
    <<: *go-svc
    container_name: sitemon-checker
    command: ["go", "run", "./apps/checker/cmd"]
    environment:
      PORT: "8081"
      NATS_URL: nats://nats:4222

  scheduler:
    <<: *go-svc
    container_name: sitemon-scheduler
    command: ["go", "run", "./apps/scheduler/cmd"]
    environment:
      PORT: "8082"
      NATS_URL: nats://nats:4222
      SCHEDULE_CRON: ${SCHEDULE_CRON:-*/5 * * * *}
      SCHEDULE_URLS: ${SCHEDULE_URLS:-https://example.com}

  notifier:
    <<: *go-svc
    container_name: sitemon-notifier
    command: ["go", "run", "./apps/notifier/cmd"]
    environment:
      PORT: "8083"
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379/0
      WEBHOOK_URL: ${WEBHOOK_URL:-}

  web:
    image: node:24-alpine
    container_name: sitemon-web
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --no-frozen-lockfile && pnpm dev --host"
    environment:
      VITE_API_PROXY: http://gateway:8080
    volumes:
      - ../apps/web:/app
      - web-node-modules:/app/node_modules
    ports:
      - "0.0.0.0:5173:5173"
    depends_on:
      - gateway
    restart: unless-stopped
    networks:
      - sitemon-net

  ai:
    <<: *go-svc
    container_name: sitemon-ai
    command: ["go", "run", "./apps/ai/cmd"]
    environment:
      PORT: "8090"
      NATS_URL: nats://nats:4222
      MONGO_URI: mongodb://sitemon:sitemon@mongo:27017/sitemon?authSource=admin
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}

  # --- observability profile: make obs-up ---
  prometheus:
    image: prom/prometheus:latest
    container_name: sitemon-prometheus
    profiles: [observability]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9099:9090"
    restart: unless-stopped
    networks:
      - sitemon-net

  grafana:
    image: grafana/grafana:latest
    container_name: sitemon-grafana
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3099:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - sitemon-net

volumes:
  mongo-data:
  redis-data:
  nats-data:
  go-build:
  go-mod:
  web-node-modules:
  grafana-data:

networks:
  sitemon-net:
    driver: bridge
