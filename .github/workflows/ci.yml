name: CI

on:
  push:
    branches: [trunk, main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Verify gofmt
        run: test -z "$(gofmt -l apps packages)" || { gofmt -l apps packages; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Build all services
        run: |
          for svc in gateway checker scheduler notifier ai cli; do
            go build -trimpath -o /tmp/$svc ./apps/$svc/cmd
          done

      - name: Test (race)
        run: CGO_ENABLED=1 go test -race ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Integration tests (testcontainers)
        run: go test -tags=integration -timeout 300s ./...
